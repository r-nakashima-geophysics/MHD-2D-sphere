[project]
name = "MHD-2D-sphere"
version = "2.0.0"
description = "These Python scripts support the findings of our study, Nakashima & Yoshida (2024)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "caffeine>=0.5",
    "cartopy>=0.25.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "psutil>=7.2.2",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "isort>=8.0.1",
    "mypy>=2.3.0",
    "pycodestyle>=2.14.0",
    "pylint>=4.0.6",
    "scipy-stubs>=1.18.0.1",
    "types-psutil>=7.2.2.20260518",
]
